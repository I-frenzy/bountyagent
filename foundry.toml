[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]
test = "test"
script = "script"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Arc targets the Osaka hard fork (docs.arc.io/arc/references/evm-differences),
# which includes Cancun: PUSH0, MCOPY and transient storage (EIP-1153) are
# available. We target "cancun" (not the solc default "prague") as the most
# conservative level that still gives us the transient reentrancy guard.
evm_version = "cancun"
# No CBOR metadata trailer: TestVectorVerifier scans candidate bytecode for
# banned opcodes, and the trailer's random hash bytes could trip that scan.
cbor_metadata = false
bytecode_hash = "none"

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "${EXPLORER_API_KEY}", url = "https://explorer.testnet.arc.io/api", chain = 5042002 }
arc_mainnet = { key = "${EXPLORER_API_KEY}", url = "https://explorer.arc.io/api", chain = 5042 }
